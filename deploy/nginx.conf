# /etc/nginx/conf.d/panorama_drawing.conf
# 치과 파노라마 3D 시각화 - Nginx 리버스 프록시 설정 (Amazon Linux)

# HTTP → HTTPS 리다이렉트
server {
    listen 80 default_server;
    server_name nanbalchi.com www.nanbalchi.com;
    return 301 https://$host$request_uri;
}

# HTTPS 서버
server {
    listen 443 ssl default_server;
    server_name nanbalchi.com www.nanbalchi.com;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nanbalchi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nanbalchi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 요청 본문 크기 (파노라마 이미지 업로드용)
    client_max_body_size 20m;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Next.js 정적 파일 (immutable 캐싱)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ONNX 모델 및 WASM 파일 (장기 캐싱)
    location /onnx/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public";
        types {
            application/wasm wasm;
            application/octet-stream onnx;
        }
    }

    # 기타 정적 파일
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 메인 리버스 프록시
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
